name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            editors/vscode/package-lock.json
      - name: Install Poetry
        run: pipx install poetry
      - name: Install dependencies and build diagram tools
        run: make setup
      - name: Package VS Code extension
        run: make extension
      - name: Verify generated YAML schemas
        run: |
          make schemas
          git diff --exit-code -- schemas/
      - name: Validate every example machine
        run: make check-all
      - name: Run Python checks
        run: make test
