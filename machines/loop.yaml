# A stationary self-loop: execution reaches MAX_STEPS and returns RUNNING.
name: Loop on blank tape
model: deterministic
tapes: 1
blank: _
input_alphabet: []
tape_alphabet: [_]
states: [loop]
start: loop
accept: []
reject: []
transitions:
  - {from: loop, read: [_], to: loop, write: [_], move: [S]}
