# Accept binary strings ending in 1. Flow groups infer from; an explicit match is allowed.
name: Ends with one
model: deterministic
tapes: 1
blank: _
input_alphabet: ["0", "1"]
tape_alphabet: ["0", "1", _]
states: [scan, last_one, accept, reject]
start: scan
accept: [accept]
reject: [reject]
transitions: {
  scan: [
    {from: scan, read: ["0"], to: scan, write: ["0"], move: [R]},
    {read: ["1"], to: last_one, write: ["1"], move: [R]},
    {read: [_], to: reject, write: [_], move: [S]}
  ],
  last_one: [
    {read: ["0"], to: scan, write: ["0"], move: [R]},
    {read: ["1"], to: last_one, write: ["1"], move: [R]},
    {read: [_], to: accept, write: [_], move: [S]}
  ]
}
