# No input: write x at cells 0 and -1 using one [read, write, direction] triple.
name: Write on blank tape
model: deterministic
tapes: 1
blank: _
input_alphabet: []
tape_alphabet: [_, x]
states: [write, finish, accept]
start: write
accept: [accept]
reject: []
transitions:
  write:
    - tapes: [[_, x, L]]
      to: finish
  finish:
    - tapes: [[_, x, S]]
      to: accept
  accept: []
