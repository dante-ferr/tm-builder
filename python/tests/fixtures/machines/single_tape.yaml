# Deterministic single-tape machine: accept strings ending in 1.
name: Ends with one
model: deterministic
tapes: 1
blank: _
input_alphabet: ["0", "1"]
tape_alphabet: ["0", "1", _]
states: [scan, last_zero, last_one, accept, reject]
start: scan
accept: [accept]
reject: [reject]
inputs: ["101"]
transitions:
  - {from: scan, tapes: [["0", "0", R]], to: last_zero}
  - {from: scan, tapes: [["1", "1", R]], to: last_one}
  - {from: last_zero, tapes: [["0", "0", R]], to: last_zero}
  - {from: last_zero, tapes: [["1", "1", R]], to: last_one}
  - {from: last_one, tapes: [["0", "0", R]], to: last_zero}
  - {from: last_one, tapes: [["1", "1", R]], to: last_one}
  - {from: last_zero, tapes: [[_, _, S]], to: reject}
  - {from: last_one, tapes: [[_, _, S]], to: accept}
  - {from: scan, tapes: [[_, _, S]], to: reject}
