# Accept binary strings containing 1. The two search/1 rules create separate branches.
name: Nondeterministic search for 1
model: nondeterministic
tapes: 1
blank: _
input_alphabet: ["0", "1"]
tape_alphabet: ["0", "1", _]
states: [search, verify, accept, reject]
start: search
accept: [accept]
reject: [reject]
transitions:
  search:
    - {tapes: [["0", "0", R]], to: search}
    - {tapes: [["1", "1", R]], to: search}
    - {tapes: [["1", "1", R]], to: verify}
    - {tapes: [[_, _, S]], to: reject}
  verify:
    - {tapes: [["0", "0", R]], to: verify}
    - {tapes: [["1", "1", R]], to: verify}
    - {tapes: [[_, _, S]], to: accept}
