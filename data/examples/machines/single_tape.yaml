# Accept binary strings ending in 1. Flow groups infer from; an explicit match is allowed.
name: Ends with one
model: deterministic
tapes: 1
blank: _
input_alphabet: ["0", "1"]
tape_alphabet: ["0", "1", _]
states: [scan, last_one, accept, reject]
start: scan
accept: [accept]
reject: [reject]
transitions: {
  scan: [
    {from: scan, tapes: [["0", "0", R]], to: scan},
    {tapes: [["1", "1", R]], to: last_one},
    {tapes: [[_, _, S]], to: reject}
  ],
  last_one: [
    {tapes: [["0", "0", R]], to: scan},
    {tapes: [["1", "1", R]], to: last_one},
    {tapes: [[_, _, S]], to: accept}
  ]
}
