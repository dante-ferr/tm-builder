# Accept binary strings containing 1. The two search/1 rules create separate branches.
name: Nondeterministic search for 1
model: nondeterministic
tapes: 1
blank: _
input_alphabet: ["0", "1"]
tape_alphabet: ["0", "1", _]
states: [search, verify, accept, reject]
start: search
accept: [accept]
reject: [reject]
transitions:
  search:
    - {read: ["0"], to: search, write: ["0"], move: [R]}
    - {read: ["1"], to: search, write: ["1"], move: [R]}
    - {read: ["1"], to: verify, write: ["1"], move: [R]}
    - {read: [_], to: reject, write: [_], move: [S]}
  verify:
    - {read: ["0"], to: verify, write: ["0"], move: [R]}
    - {read: ["1"], to: verify, write: ["1"], move: [R]}
    - {read: [_], to: accept, write: [_], move: [S]}
