# Demonstrates nondeterministic branching: accepts {0,1}*1{0,1}*.
name: Nondeterministic search for 1
model: nondeterministic
tapes: 1
blank: _
input_alphabet: ["0", "1"]
tape_alphabet: ["0", "1", _]
states: [search, verify, accept, reject]
start: search
accept: [accept]
reject: [reject]
inputs: ["00100"]
transitions:
  - {from: search, tapes: [["0", "0", R]], to: search}
  - {from: search, tapes: [["1", "1", R]], to: search}
  - {from: search, tapes: [["1", "1", R]], to: verify}
  - {from: search, tapes: [[_, _, S]], to: reject}
  - {from: verify, tapes: [["0", "0", R]], to: verify}
  - {from: verify, tapes: [["1", "1", R]], to: verify}
  - {from: verify, tapes: [[_, _, S]], to: accept}
